version: '3.8'

services:
  # ─── Infrastructure ─────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bankflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [bankflow-network]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bankflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks: [bankflow-network]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: bankflow-redis
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    networks: [bankflow-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: bankflow-postgres
    environment:
      POSTGRES_PASSWORD: bankflow123
      POSTGRES_USER: bankflow
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [bankflow-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ────────────────────────────────
  user-service:
    build: ./user-service
    container_name: bankflow-user-service
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks: [bankflow-network]
    restart: unless-stopped

  account-service:
    build: ./account-service
    container_name: bankflow-account-service
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accounts_db
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [bankflow-network]
    restart: unless-stopped

  transaction-service:
    build: ./transaction-service
    container_name: bankflow-txn-service
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transactions_db
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [bankflow-network]
    restart: unless-stopped

  loan-service:
    build: ./loan-service
    container_name: bankflow-loan-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loans_db
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [bankflow-network]
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: bankflow-notification-service
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["8085:8085"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
    networks: [bankflow-network]
    restart: unless-stopped

  fraud-detection-service:
    build: ./fraud-detection-service
    container_name: bankflow-fraud-service
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8086:8086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_db
      SPRING_DATASOURCE_USERNAME: bankflow
      SPRING_DATASOURCE_PASSWORD: bankflow123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [bankflow-network]
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: bankflow-gateway
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - loan-service
    ports: ["8080:8080"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks: [bankflow-network]
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bankflow-frontend
    depends_on: [api-gateway]
    ports: ["3000:80"]
    networks: [bankflow-network]

networks:
  bankflow-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: